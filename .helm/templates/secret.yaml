apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appName }}-secret
data:
  mongo_uri: {{ .Values.mongo_uri | b64enc }}
  redis_password: {{ .Values.redis_password | b64enc }}
  twitter_token: {{ .Values.twitter_token | b64enc }}
  s3_key: {{ .Values.s3_key | b64enc }}
  s3_secret: {{ .Values.s3_secret | b64enc }}
